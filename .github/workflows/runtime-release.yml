name: Runtime Release

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime bundle version
        required: true
      manim_version:
        description: Pinned Manim Community version
        required: true
        default: "0.20.1"
      python_version:
        description: Pinned Python version for runtime bundles
        required: true
        default: "3.11"
      minimum_cli_version:
        description: Minimum compatible manim-cli npm version
        required: true
        default: "0.1.0"
      prerelease:
        description: Publish as prerelease
        required: true
        default: "true"
      include_linux_arm64:
        description: Build the linux-arm64 runtime (requires a self-hosted ARM64 Linux runner)
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  build-runtime:
    if: ${{ matrix.platform != 'linux-arm64' || inputs.include_linux_arm64 == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runs_on: '["macos-14"]'
            shell: bash
            archive_type: tar.gz
          - platform: darwin-x64
            runs_on: '["macos-13"]'
            shell: bash
            archive_type: tar.gz
          - platform: linux-x64
            runs_on: '["ubuntu-24.04"]'
            shell: bash
            archive_type: tar.gz
          - platform: linux-arm64
            runs_on: '["self-hosted","linux","arm64"]'
            shell: bash
            archive_type: tar.gz
          - platform: win32-x64
            runs_on: '["windows-2025"]'
            shell: pwsh
            archive_type: zip
    runs-on: ${{ fromJson(matrix.runs_on) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: ${{ matrix.shell == 'bash' && 'bash' || 'powershell' }}
          cache-downloads: true
          cache-environment: false

      - name: Install conda-pack
        shell: ${{ matrix.shell }}
        run: micromamba install -y -n base -c conda-forge conda-pack

      - name: Install npm dependencies
        run: npm ci

      - name: Provision runtime root (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: >
          bash scripts/provision-runtime-unix.sh
          --runtime-root runtime/build/${{ matrix.platform }}/manim-runtime
          --platform ${{ matrix.platform }}
          --runtime-version ${{ inputs.runtime_version }}
          --manim-version ${{ inputs.manim_version }}
          --python-version ${{ inputs.python_version }}

      - name: Provision runtime root (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./scripts/provision-runtime-windows.ps1
          -RuntimeRoot runtime/build/${{ matrix.platform }}/manim-runtime
          -Platform ${{ matrix.platform }}
          -RuntimeVersion ${{ inputs.runtime_version }}
          -ManimVersion ${{ inputs.manim_version }}
          -PythonVersion ${{ inputs.python_version }}

      - name: Resolve micromamba path (Unix)
        if: runner.os != 'Windows'
        id: micromamba_unix
        shell: bash -l {0}
        run: echo "path=$(command -v micromamba)" >> "$GITHUB_OUTPUT"

      - name: Resolve micromamba path (Windows)
        if: runner.os == 'Windows'
        id: micromamba_windows
        shell: pwsh
        run: '"path=$((Get-Command micromamba).Source)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Prepare runtime bootstrap bundle
        shell: ${{ matrix.shell }}
        run: >
          npm run runtime:bundle --
          --bundle-root runtime/bundle/${{ matrix.platform }}/manim-runtime
          --platform ${{ matrix.platform }}
          --version ${{ inputs.runtime_version }}
          --manim-version ${{ inputs.manim_version }}
          --python-version ${{ inputs.python_version }}
          --micromamba-path ${{ runner.os == 'Windows' && steps.micromamba_windows.outputs.path || steps.micromamba_unix.outputs.path }}

      - name: Pack runtime archive
        run: >
          npm run runtime:pack --
          --runtime-root runtime/bundle/${{ matrix.platform }}/manim-runtime
          --platform ${{ matrix.platform }}
          --version ${{ inputs.runtime_version }}
          --archive-type ${{ matrix.archive_type }}
          --out-dir runtime/dist

      - name: Upload runtime archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: runtime/dist/*

  publish-archives:
    needs: build-runtime
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        run: echo "release_tag=runtime-v${{ inputs.runtime_version }}" >> "$GITHUB_OUTPUT"

      - name: Download runtime archives
        uses: actions/download-artifact@v4
        with:
          path: runtime/dist
          pattern: runtime-*
          merge-multiple: true

      - name: Publish runtime archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Runtime ${{ inputs.runtime_version }}
          draft: false
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: runtime/dist/*

  generate-manifest:
    needs: publish-archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Download runtime archives
        uses: actions/download-artifact@v4
        with:
          path: runtime/dist
          pattern: runtime-*
          merge-multiple: true

      - name: Generate runtime manifest
        run: >
          npm run runtime:manifest --
          --bundles-dir runtime/dist
          --github-repo ${{ github.repository }}
          --release-tag ${{ needs.publish-archives.outputs.release_tag }}
          --version ${{ inputs.runtime_version }}
          --minimum-cli-version ${{ inputs.minimum_cli_version }}
          --install-strategy bootstrap
          --out runtime/runtime-manifest.json

      - name: Validate runtime manifest
        run: npm run runtime:validate -- runtime/runtime-manifest.json

      - name: Upload runtime manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest
          path: runtime/runtime-manifest.json

      - name: Publish runtime manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-archives.outputs.release_tag }}
          files: runtime/runtime-manifest.json
