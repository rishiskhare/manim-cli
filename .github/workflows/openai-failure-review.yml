name: OpenAI Failure Review

on:
  workflow_run:
    workflows:
      - CI
      - Runtime Release
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture failed workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh run view "$RUN_ID" --repo "$REPO" --log-failed > failed.log 2>/dev/null; then
            gh run view "$RUN_ID" --repo "$REPO" --log > failed.log
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path("failed.log").read_text(errors="ignore").strip()
          if not text:
              text = "No workflow log output was captured."
          excerpt = "\n".join(text.splitlines()[-250:])
          if len(excerpt) > 20000:
              excerpt = excerpt[-20000:]
          Path("failed-excerpt.txt").write_text(excerpt)
          PY

      - name: Generate failure analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5-codex' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          GITHUB_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          GITHUB_RUN_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          node scripts/openai-review.mjs \
            --mode failure-review \
            --input-file failed-excerpt.txt \
            --output-file review.md

      - name: Post analysis to PR or issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("review.md", "utf8");
            const run = context.payload.workflow_run;
            const pulls = run.pull_requests || [];

            if (pulls.length > 0) {
              const pr = pulls[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              core.info(`Posted OpenAI analysis to PR #${pr.number}`);
              return;
            }

            const title = `OpenAI build analysis: ${run.name} failed on ${run.head_branch || "unknown-branch"}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info("Opened issue for failed workflow run");
