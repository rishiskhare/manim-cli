name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Review this pull request for bugs, regressions, correctness issues, runtime risks, and missing test coverage.

            Focus on:
            - release workflow correctness
            - packaging/distribution regressions
            - managed runtime installation safety
            - CI/workflow robustness

            Post findings as GitHub review comments. Prefer high-signal issues over stylistic suggestions.
